apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-server
spec:
  selector:
    matchLabels:
      app: simple-server
  template:
    metadata:
      labels:
        app: simple-server
    spec:
      containers:
      - name: simple-server
        image: quay.io/gfarache/sample-server:latest
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health        
            port: 8080           
          initialDelaySeconds: 10
          periodSeconds: 15      
          failureThreshold: 3    
        readinessProbe:
          httpGet:
            path: /health        
            port: 8080           
          initialDelaySeconds: 5 
          periodSeconds: 10      
          failureThreshold: 3    
---
apiVersion: v1
kind: Service
metadata:
  name: simple-server-service
spec:
  selector:
    app: simple-server
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
