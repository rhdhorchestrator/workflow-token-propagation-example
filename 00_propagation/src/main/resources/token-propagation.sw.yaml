id: token-propagation
version: "1.0"
specVersion: "0.8"
name: "Token Propagation"
description: Propagate token
functions:
  - name: getWithSimpleBearerTokenSecurityScheme
    operation: specs/simple-server.yaml#getWithSimpleBearerTokenSecurityScheme
  - name: print
    type: custom
    operation: sysout
  - name: getBasicIdentity
    type: expression
    operation: '.identity=($WORKFLOW.headers["x-authorization-basic"] | @base64d | split(":")[0])'
  - name: successResult
    type: expression
    operation: '{
        "result": {
          "completedWith":"success",
          "message": "Token propagated, check the simple server logs: " + $WORKFLOW.identity,
          "outputs":[]
        }
      }'
start: "Print inputs"
states:
  - name: Print inputs
    type: operation
    actions:
      - name: print
        functionRef:
          refName: print
          arguments:
            message: '${"headers: " + ($WORKFLOW.headers | to_entries | map( "-var=\"\( .key + "=" + .value )\"" ) | join( " " )) }'
      - name: "getWithSimpleBearerTokenSecurityScheme"
        functionRef:
          refName: getWithSimpleBearerTokenSecurityScheme
      - name: callSubflow1
        subFlowRef: testSubflow
        actionDataFilter:
          useResults: false
      - name: "getWithSimpleBearerTokenSecuritySchemeAfterSleep"
        sleep:
          before: PT10S
        functionRef:
          refName: getWithSimpleBearerTokenSecurityScheme
      - name: print2
        functionRef:
          refName: print
          arguments:
            message: '${"headers2: " + ($WORKFLOW.headers | to_entries | map( "-var=\"\( .key + "=" + .value )\"" ) | join( " " )) }'
      - name: setOutput
        functionRef:
          refName: successResult
    end: true
